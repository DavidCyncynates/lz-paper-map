name: Validate site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check generated catalog and map artifacts
        run: pnpm check:generated

      - name: Validate the paper catalog
        run: python scripts/update_papers.py --validate-only

      - name: Test incremental maintenance state
        run: pnpm test:maintenance

      - name: Test generated catalog index
        run: pnpm test:catalog-index

      - name: Check types
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test hierarchical map layout
        run: pnpm test:layout

      - name: Test generated map layouts
        run: pnpm test:layout-artifact

      - name: Test map camera math
        run: pnpm test:map-camera

      - name: Test publication date filtering
        run: pnpm test:date-range

      - name: Test citation sizing
        run: pnpm test:citation-size

      - name: Test color-theme behavior
        run: pnpm test:theme

      - name: Test search discovery
        run: pnpm test:seo

      - name: Build the static site
        run: pnpm build

      - name: Check search artifacts
        run: pnpm check:seo
