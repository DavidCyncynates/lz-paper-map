name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set the public site address
        shell: bash
        run: |
          repository_name="${GITHUB_REPOSITORY#*/}"
          repository_name_lower="${repository_name,,}"
          owner_lower="${GITHUB_REPOSITORY_OWNER,,}"
          if [[ "${repository_name_lower}" == "${owner_lower}.github.io" ]]; then
            site_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/"
          else
            site_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${repository_name}/"
          fi
          echo "NEXT_PUBLIC_SITE_URL=${site_url}" >> "${GITHUB_ENV}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate the paper catalog
        run: python scripts/update_papers.py --validate-only

      - name: Check types and lint
        run: |
          pnpm typecheck
          pnpm lint

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build the static site
        run: pnpm build

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
